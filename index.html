
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso - Sistema de Gestão</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(135deg,#071b36,#123e70)}
.login{width:90%;max-width:390px;padding:38px 30px;border-radius:16px;background:white;box-shadow:0 15px 45px #0005}
h2{text-align:center;color:#12345a}
.cadastro-extra{display:none}.cadastro-extra.ativo{display:block}.link-btn{background:transparent;color:#174a76;margin-top:12px;padding:8px;border:0;font-size:14px}.link-btn:hover{text-decoration:underline}.nota{font-size:12px;line-height:1.45;color:#667085;text-align:left}.login button:disabled{opacity:.65;cursor:wait}
p{text-align:center;color:#667085}
label{display:block;margin:18px 0 7px;color:#24364b}
input{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:8px;font-size:16px}
button{width:100%;margin-top:25px;padding:14px;border:0;border-radius:8px;background:#123e70;color:white;font-size:16px;font-weight:bold;cursor:pointer}
#mensagem{font-size:14px;color:#b42318}
</style>
</head>
<body>
<div class="login">
<h2>Sistema de Gestão</h2>
<p id="subtitulo">Acesse com sua matrícula e senha</p>
<form id="loginForm">
<label>Usuário</label>
<input id="usuario" placeholder="Digite sua matrícula" required>
<label>Senha</label>
<input id="senha" type="password" placeholder="Digite sua senha" required minlength="6">
<div id="cadastroExtra" class="cadastro-extra">
<label>Nome completo</label><input id="nome" autocomplete="name" placeholder="Seu nome completo">
<label>E-mail para contato e recuperação</label><input id="emailContato" type="email" autocomplete="email" placeholder="seuemail@exemplo.com">
<label>Telefone / celular</label><input id="telefone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000">
<p class="nota">Após o cadastro, sua conta será liberada automaticamente. O e-mail e o telefone serão guardados para contato e futura recuperação de senha.</p>
</div>
<button id="entrar" type="submit">Entrar</button>
<button id="alternarCadastro" class="link-btn" type="button">Criar minha conta</button>
<p id="mensagem" role="status" aria-live="polite"></p>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vfwvwgmgizavtnoptrvb.supabase.co";
const SUPABASE_KEY = "sb_publishable_e6iGnalwPhL0kCyf1lhBDg_vqmM12UE";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let modoCadastro = false;
function alternarModoCadastro(){
  modoCadastro = !modoCadastro;
  $('cadastroExtra').classList.toggle('ativo', modoCadastro);
  $('subtitulo').textContent = modoCadastro ? 'Crie sua conta para acessar o sistema' : 'Acesse com sua matrícula e senha';
  $('entrar').textContent = modoCadastro ? 'Criar conta e entrar' : 'Entrar';
  $('alternarCadastro').textContent = modoCadastro ? 'Já tenho uma conta' : 'Criar minha conta';
  $('nome').required = modoCadastro;
  $('emailContato').required = modoCadastro;
  $('telefone').required = modoCadastro;
  $('mensagem').textContent = '';
}
$('alternarCadastro').addEventListener('click', alternarModoCadastro);
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const matricula = $('usuario').value.trim();
  const senha = $('senha').value;
  const mensagem = $('mensagem');
  const botao = $('entrar');
  if(!/^[A-Za-z0-9._-]{3,30}$/.test(matricula)){
    mensagem.textContent = 'Informe uma matrícula válida (3 a 30 caracteres, sem espaços).'; return;
  }
  botao.disabled = true; botao.textContent = modoCadastro ? 'Criando conta...' : 'Entrando...'; mensagem.textContent = '';
  const emailLogin = `${matricula.toLowerCase()}@cadastro-cliente.com`;
  try {
    if(modoCadastro){
      const nome = $('nome').value.trim();
      const emailContato = $('emailContato').value.trim().toLowerCase();
      const telefone = $('telefone').value.trim();
      if(!nome || !emailContato || !telefone) throw new Error('Preencha nome, e-mail e telefone.');
      if(senha.length < 6) throw new Error('A senha deve ter pelo menos 6 caracteres.');
      const {data,error} = await db.auth.signUp({
        email: emailLogin,
        password: senha,
        options: { data: { matricula, nome, email_contato: emailContato, telefone } }
      });
      if(error) throw error;
      if(data.session){
        window.location.href = 'painel.html';
      } else {
        mensagem.textContent = 'Cadastro criado. Se o sistema pedir confirmação de e-mail, a confirmação precisa ser desativada nas configurações do Supabase para liberar o acesso automático.';
      }
    } else {
      const {error} = await db.auth.signInWithPassword({email:emailLogin,password:senha});
      if(error) throw error;
      window.location.href = 'painel.html';
    }
  } catch(err){
    const msg = String(err?.message || 'Erro inesperado');
    mensagem.textContent = msg.includes('already registered') || msg.includes('already been registered') ? 'Essa matrícula já está cadastrada.' : (msg.includes('Invalid login') ? 'Matrícula ou senha incorretos.' : 'Não foi possível concluir: '+msg);
  } finally {
    botao.disabled = false; botao.textContent = modoCadastro ? 'Criar conta e entrar' : 'Entrar';
  }
});
</script>
</body>
</html>
